# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Pin the JDK used to run Gradle/AGP. The machine's JAVA_HOME points at an old
# JDK 11 which the Android Gradle Plugin rejects (needs 17+). Android Studio's
# bundled JBR (JDK 21) is a known-good runtime. Adjust this path if you build on
# a machine without Android Studio installed.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
