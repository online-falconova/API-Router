name: Publish Fork Image to GHCR

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

# Least-privilege default: read-only at the top level; the build job that pushes to
# GHCR grants packages: write itself (Scorecard TokenPermissions).
permissions:
  contents: read

env:
  # GHCR requires a lowercase image path, so this is not a 1:1 echo of the repo name
  # (online-falconova/API-Router).
  IMAGE_NAME: ghcr.io/online-falconova/api-router

jobs:
  build:
    name: Build and Push Fork Image
    if: github.repository == 'online-falconova/API-Router'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=api-router
            org.opencontainers.image.description=Unified AI proxy/router — API Router fork image
            org.opencontainers.image.url=https://github.com/online-falconova/API-Router
            org.opencontainers.image.source=https://github.com/online-falconova/API-Router
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          # amd64 only: the Dokploy VPS is x86_64, and dropping the emulated arm64
          # leg (which needs QEMU) roughly halves wall-clock build time.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
